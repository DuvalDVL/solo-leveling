<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solo Leveling RPG - Projet</title>
    <!-- Le CSS sera géré à la toute fin -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- CONTENEUR GLOBAL -->
    <div id="game-container">
        
        <!-- HUD (Affichage Tête Haute) - Totalement masqué en Phase 1 -->
        <header id="hud" style="display: none;">
            <div class="hud-top">
                <span id="hud-name"></span> | Classe : <span id="hud-class"></span> | Rang <span id="hud-rank">E</span> | Niv. <span id="hud-level">1</span>
            </div>
            <div class="hud-stats">
                PV: <span id="hud-hp"></span>/<span id="hud-maxhp"></span> | 
                PM: <span id="hud-mp"></span>/<span id="hud-maxmp"></span> | 
                Fatigue: <span id="hud-fatigue">0</span>/100
            </div>
            <div class="hud-economy">
                Or: <span id="hud-gold">0</span> | Essence: <span id="hud-essence">0</span> | Karma: <span id="hud-karma">0</span>
            </div>
            
            <!-- Interface Système (Débloquée en Phase 3 uniquement) -->
            <div id="hud-system" style="display: none;">
                Points libres: <span id="hud-freepoints">0</span>
                <button onclick="addStat('force')">+ Force</button>
                <button onclick="addStat('agilite')">+ Agilité</button>
                <button onclick="addStat('intelligence')">+ Intel</button>
                <button onclick="addStat('vitalite')">+ Vitalité</button>
                <button onclick="addStat('perception')">+ Perception</button>
            </div>
        </header>

        <!-- ÉCRAN 1 : CRÉATION DE PERSONNAGE (Phase 1) -->
        <section id="screen-creation">
            <h1>L'Éveil</h1>
            <div class="form-group">
                <label for="char-name">Nom du personnage :</label>
                <input type="text" id="char-name" placeholder="Entrez votre nom">
            </div>
            <div class="form-group">
                <label for="char-job">Passé / Métier :</label>
                <select id="char-job">
                    <option value="ouvrier">Ouvrier (Bonus Force)</option>
                    <option value="employe">Employé (Bonus Intelligence)</option>
                    <option value="livreur">Livreur (Bonus Agilité)</option>
                    <option value="etudiant">Étudiant (Équilibré)</option>
                </select>
            </div>
            <button onclick="startGame()">Lancer la Phase 1</button>
        </section>

        <!-- ÉCRAN 2 : ÉVÉNEMENTS NARRATIFS (Phases 1, 2 et 3) -->
        <!-- Utilisé pour la vie civile, l'exploration de donjons et le Temple de Carthénon -->
        <section id="screen-event" style="display: none;">
            <h2 id="event-title">Titre de l'événement</h2>
            <p id="event-description">Description de l'événement...</p>
            <div id="event-choices">
                <!-- Les boutons de choix seront injectés ici par le JS -->
            </div>
        </section>

        <!-- ÉCRAN 3 : LE HUB CENTRAL (Phases 2 et 3) -->
        <section id="screen-hub" style="display: none;">
            <h2>Hub Central</h2>
            <div id="hub-alerts">
                <!-- Notifications (ex: Loyer dans X jours) -->
            </div>
            <nav id="hub-menu">
                <button onclick="rest()">Dormir (Passe 1 jour, Restaure PV/PM)</button>
                <button onclick="train()">S'entraîner (Passe 1 jour)</button>
                <button onclick="showInventory()">Inventaire</button>
                <button onclick="showShops()">Boutiques</button>
                <button onclick="showDungeons()">Portails (Donjons)</button>
                <button onclick="showGuild()">Guilde & Escouades</button>
                
                <!-- Débloqué en Phase 3 -->
                <button id="btn-association" style="display: none;" onclick="visitAssociation()">Association des Chasseurs</button>
                <button id="btn-system-shop" style="display: none;" onclick="showSystemShop()">Boutique du Système</button>
            </nav>
            <div id="hub-content">
                <!-- Contenu dynamique du hub (grille inventaire, liste des monstres, etc.) -->
            </div>
        </section>

        <!-- ÉCRAN 4 : COMBAT TACTIQUE -->
        <section id="screen-combat" style="display: none;">
            <h2 id="combat-title">Combat</h2>
            
            <div id="combat-arena">
                <div id="combat-enemies">
                    <!-- Génération dynamique des ennemis, de leurs PV et Altérations d'état -->
                </div>
                
                <div id="combat-player-party">
                    <!-- Affichage de la position (Avant/Arrière) et de l'état des alliés PNJ -->
                </div>
            </div>

            <div id="combat-actions">
                <!-- Boutons générés dynamiquement (Attaque, Compétence, Fuite, Analyser, Trahir) -->
            </div>

            <!-- Le Journal de Combat -->
            <div id="combat-log" style="height: 200px; overflow-y: auto; border: 1px solid #000; margin-top: 15px; padding: 10px;">
                <!-- Logs textuels colorés (ex: "Vous infligez 15 dégâts", "Votre allié meurt") -->
            </div>
        </section>

    </div>
    
    <!-- Scripts contenant la Base de données puis la Logique -->
    <script src="data.js"></script>
    <script src="logic.js"></script>
</body>
</html>
