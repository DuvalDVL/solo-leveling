<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Solo Leveling - Text RPG</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/system-ui.css">
    <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
    <!-- Conteneur Principal du Jeu -->
    <div id="game-container">
        <!-- En-tête / Barre d'État -->
        <header id="status-bar" class="hidden">
            <div class="stat-item" title="Points de Vie"><span id="stat-hp">100</span></div>
            <div class="stat-item" title="Mana"><span id="stat-mp">50</span></div>
            <div class="stat-item" title="Argent"><span id="stat-money">0</span></div>
            <div class="stat-item" title="Fatigue"><span id="stat-fatigue">0</span>/100</div>
            <div class="stat-item" title="Moral"><span id="stat-morale">100</span></div>
        </header>

        <!-- ZONE DYNAMIQUE DES ÉCRANS -->
        <main id="screen-viewport">
            
            <!-- 1. Écran Titre -->
            <section id="screen-title" class="screen active">
                <div class="title-wrapper">
                    <h1 class="glitch-title">SOLO LEVELING</h1>
                    <p class="subtitle">Text RPG Édition Privée</p>
                </div>
                <div class="menu-actions">
                    <button class="btn primary" onclick="GameEngine.startMode(1)">Mode Principal (Simulation)</button>
                    <button class="btn secondary" onclick="GameEngine.startMode(2)">Mode Chasseur Établi</button>
                    <button class="btn system" onclick="GameEngine.startMode(3)">Mode Système</button>
                    <button class="btn outline hidden" id="btn-load" onclick="GameEngine.loadGame()">Charger la partie</button>
                </div>
            </section>

            <!-- 2. Écran de Création / Phase Pré-éveil -->
            <section id="screen-creation" class="screen hidden">
                <h2 id="creation-title">Phase de Transition</h2>
                <div id="creation-text-box" class="text-box"></div>
                <div id="creation-choices" class="choices-container"></div>
            </section>

            <!-- 3. Écran de la Ville (Hub) -->
            <section id="screen-city" class="screen hidden">
                <div class="city-header">
                    <h3>Monde Réel Saisons & Gestion</h3>
                    <p>Jours restants avant le prochain Raid: <span id="days-left">30</span></p>
                </div>
                <div class="city-dashboard">
                    <button class="city-btn" onclick="CityManager.openShop()">Boutique / Shop</button>
                    <button class="city-btn" onclick="CityManager.openTraining()">S'entraîner (Stats)</button>
                    <button class="city-btn" onclick="CityManager.openSocial()">Réseaux / Networking</button>
                    <button class="city-btn" onclick="CityManager.openLife()">Vie Privée / Repos</button>
                </div>
                <div class="city-footer">
                    <button class="btn primary full-width" onclick="CityManager.openRaidBoard()">Consulter les Portails</button>
                </div>
            </section>

            <!-- 4. Écran de Donjon / Combat -->
            <section id="screen-dungeon" class="screen hidden">
                <div id="dungeon-header">
                    <span id="dungeon-name">Portail de Rang E</span>
                    <span id="dungeon-progress">Salle 1 / 5</span>
                </div>
                <div id="dungeon-text-box" class="text-box"></div>
                <div id="dungeon-choices" class="choices-container"></div>
            </section>

        </main>

        <!-- Zone de Notification / Popup Événement Aléatoire -->
        <div id="modal-overlay" class="hidden">
            <div id="modal-content">
                <h3 id="modal-title">Alerte</h3>
                <p id="modal-text">Description de l'événement...</p>
                <div id="modal-actions"></div>
            </div>
        </div>
    </div>

    <!-- Scripts JS -->
    <script src="data/events_civil.js"></script>
    <script src="data/events_dungeon.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/city.js"></script>
</body>
</html>
